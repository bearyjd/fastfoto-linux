[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fastfoto-linux"
version = "0.0.1"
description = "Native Linux support for the Epson FastFoto FF-680W photo scanner"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "src/fastfoto_linux/models/LICENSE-YuNet"]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=5.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastfoto_linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 60
markers = [
    "real_scans: needs private local scans in test-scans/ (skipped in CI)",
    "hardware: needs a connected FF-680W (skipped in CI)",
]

[tool.coverage.run]
source = ["fastfoto_linux"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
