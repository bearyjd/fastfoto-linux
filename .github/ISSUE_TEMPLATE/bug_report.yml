name: Bug report
description: Something in Feedshot does not work as documented.
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public. Never attach or paste family scans, scanned documents, OCR text,
        captures or pcaps.** Describe what you see in words, or use a synthetic or rights-cleared
        image. Replace scanner serial numbers, your user name, home paths, host names, IP addresses
        and e-mail addresses with placeholders such as `SERIAL`, `~`, `HOST`.
        For a problem with a scanner itself use the "Scanner report" form instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command line (for example `ffscan doc process ... --dry-run`) or the clicks in the app.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Photos, Documents, Desktop app, ffscan command line, Flatpak, Install, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "The version in `pyproject.toml` of the install, the release tag, or the commit hash if you run from git."
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it is installed
      options: [Flatpak, Native install script, uv from a checkout, Other]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, desktop and Python version
      placeholder: e.g. Fedora 44, KDE Plasma 6, Python 3.14
  - type: textarea
    id: logs
    attributes:
      label: Error output (sanitised)
      description: Paste only the error lines, after removing paths with your name, serial numbers and any text from your documents.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not attached or pasted any private scan, document text, serial number, address or personal path.
          required: true
