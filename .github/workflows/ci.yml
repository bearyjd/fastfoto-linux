name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Private scans and captures must never be committed
        run: test -z "$(git ls-files test-scans captures '*.pcap' '*.pcapng')"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --only-dev --python 3.13
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: The desktop installer's hashed requirements match uv.lock
        run: uv export --locked --no-dev --no-emit-project --hashes --no-header --no-annotate --quiet | diff - packaging/requirements-desktop.txt
      - name: The OCR extra's hashed requirements match uv.lock
        run: uv export --locked --no-dev --no-emit-project --extra ocr --hashes --no-header --no-annotate --quiet | diff - packaging/requirements-ocr.txt

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --python ${{ matrix.python }}
      # One worker per CPU of the runner (pytest-xdist). Each worker is told to use one thread,
      # as OpenCV and NumPy would otherwise start a thread per CPU in every worker and the
      # workers would spend their time waiting for each other.
      - name: Tests, in parallel, with 80% coverage
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OPENCV_FOR_THREADS_NUM: "1"
        run: uv run --no-sync pytest -n auto --cov --cov-report=term-missing
      - name: The desktop app's plain-Python modules are covered at 85% (the Qt layer is not run here)
        run: uv run --no-sync coverage report --include='*/fastfoto_linux/gui/*' --fail-under=85
      - name: Wheel ships the face model and its licence
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          python3 -m zipfile -l "$RUNNER_TEMP"/wheel/*.whl | tee "$RUNNER_TEMP/wheel-files.txt"
          grep -q 'fastfoto_linux/models/face_detection_yunet_2023mar\.onnx' "$RUNNER_TEMP/wheel-files.txt"
          grep -q 'fastfoto_linux/models/LICENSE-YuNet' "$RUNNER_TEMP/wheel-files.txt"
          grep -q 'dist-info/licenses/.*LICENSE-YuNet' "$RUNNER_TEMP/wheel-files.txt"
      - name: Wheel ships the QML and the fastfoto launcher
        run: |
          for qml in src/fastfoto_linux/gui/qml/*.qml; do
            grep -q "fastfoto_linux/gui/qml/$(basename "$qml")" "$RUNNER_TEMP/wheel-files.txt"
          done
          python3 -m zipfile -e "$RUNNER_TEMP"/wheel/*.whl "$RUNNER_TEMP/unpacked"
          grep -q 'fastfoto = fastfoto_linux.gui.qt.app:main' "$RUNNER_TEMP"/unpacked/*.dist-info/entry_points.txt
          ! grep -qi '^Requires-Dist:.*pyside' "$RUNNER_TEMP"/unpacked/*.dist-info/METADATA

  # The desktop app needs the distribution's PySide6 and Kirigami (the PyPI PySide6 wheel bundles
  # its own Qt and cannot load the system Kirigami plugin), so it is tested in a Fedora container.
  # A required check: it is listed in the branch protection.
  gui-fedora:
    name: gui (fedora)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # fedora:44 on Docker Hub, pinned by digest so that a changed image cannot change this job;
    # to update, look up the new digest of the tag (skopeo inspect docker://fedora:44) and edit here.
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      FASTFOTO_REQUIRE_QT: "1"
    steps:
      - name: Install the Qt stack and the tools
        run: >
          dnf install -y --setopt=install_weak_deps=False
          python3-pyside6 kf6-kirigami qt6-qtdeclarative kf6-qqc2-desktop-style
          kf6-breeze-icons google-noto-sans-fonts python3-gobject-base uv git make gcc gawk desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Environment that sees the system PySide6
        run: |
          uv venv --system-site-packages --python /usr/bin/python3 "$RUNNER_TEMP/venv"
          # Everything comes from hashed files: the locked dependencies, the build backend, and then
          # this checkout (built with that backend; installed as a wheel, like the app's installer).
          uv export --locked --no-emit-project --group dev --hashes --no-header --no-annotate \
            --quiet -o "$RUNNER_TEMP/dev.txt"
          export VIRTUAL_ENV="$RUNNER_TEMP/venv"
          uv pip install --require-hashes -r "$RUNNER_TEMP/dev.txt"
          uv pip install --require-hashes -r packaging/requirements-build.txt
          uv pip install --no-build-isolation --no-deps .
      - name: Qt and QML tests, with 80% coverage of the Qt layer
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          pytest tests/gui/qt tests/gui/test_packaging.py tests/gui/test_install_script.py \
            tests/gui/test_app_guard.py --cov --cov-config=tools/ci/coveragerc-gui-qt \
            --cov-report=term-missing --cov-fail-under=80

  # The Flatpak bundle of the desktop app (packaging/flatpak), then a smoke test of the OCR that it
  # brings (Tesseract with English and orientation data, and OCRmyPDF), run in its own sandbox. The
  # builder image for KDE 6.11 is
  # ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11, pinned by digest so that a changed image
  # cannot change this job; to update, look up the new digest of the tag
  # (skopeo inspect --raw docker://ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11 | sha256sum)
  # and edit here. The action uploads the bundle as an artifact.
  flatpak:
    name: flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: io.github.bearyjd.FastFotoLinux.flatpak
          manifest-path: packaging/flatpak/io.github.bearyjd.FastFotoLinux.yml
          upload-artifact: true
      # The action leaves the bundle in the workspace. The runtime is installed by the build.
      - name: Install the bundle for the user
        run: flatpak install --user --noninteractive --bundle io.github.bearyjd.FastFotoLinux.flatpak
      - name: OCR inside the sandbox
        timeout-minutes: 5
        run: tools/ci/flatpak-ocr-smoke.sh
      # What Flathub's reviewers would run on the metadata. Informational for now (a first look at
      # the findings); not a required check. flatpak-builder-lint is not run here: it needs the
      # org.flatpak.Builder app and the 26.08 SDK, several GB (see docs/flathub-submission.md).
      - name: Metadata lint (informational)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          appstreamcli validate --pedantic --explain --no-net packaging/io.github.bearyjd.FastFotoLinux.metainfo.xml
          desktop-file-validate packaging/io.github.bearyjd.FastFotoLinux.desktop
